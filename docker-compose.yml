services:
  postgres:
    image: postgres:16-alpine
    container_name: insider_league_postgres
    environment:
      POSTGRES_USER: insider
      POSTGRES_PASSWORD: insider
      POSTGRES_DB: insider_league
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insider -d insider_league"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    container_name: insider_league_api
    environment:
      SERVER_PORT: 8080
      GIN_MODE: release
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: insider
      DB_PASSWORD: insider
      DB_NAME: insider_league
      DB_SSLMODE: disable
      SIMULATION_SEED: 20260518
      PREDICTION_SEED: 42024
      PREDICTION_ITERATIONS: 10000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
